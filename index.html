<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>My Task List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My Task List</h1>

        <div class="input-area">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Learn something..."
            >

            <button id="addTaskBtn">Add Task</button>
        </div>

        <p id="taskCount">Task: 0</p>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
